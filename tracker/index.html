<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<header class="navbar">
    <div class="logo"><img src="/assets/finlogo.png" alt="LFOR logo"></div>
    <nav>
        <a href="/">Home</a>
        <a href="/papers.html">Papers</a>
        <a href="/presentations.html">Presentations</a>
        <a href="/apps/">Apps</a>
        <a href="/tracker/index.html">Portfolio Tracker</a>
        <a href="/assets/CV.pdf" target="_blank">CV</a>
    </nav>
</header>

<main class="container">

    <section id="login-section">
        <div class="intro">
            <h1>Portfolio Tracker</h1>
            <p>Sign in to view your holdings.</p>
        </div>

        <form id="login-form" class="auth-form">
            <label for="login-username">Username</label>
            <input id="login-username" type="text" autocomplete="username" required>

            <label for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>

        <details class="auth-form">
            <summary>Create an account</summary>
            <form id="signup-form">
                <label for="signup-username">Username</label>
                <input id="signup-username" type="text" autocomplete="username" required>

                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" autocomplete="new-password" required>

                <button type="submit">Sign up</button>
            </form>
        </details>

        <p id="status" class="status" role="status"></p>
    </section>

    <section id="dashboard" hidden>
        <div class="intro">
            <h1 id="dashboard-title">Portfolio</h1>
            <p>Signed in as <span id="who"></span>. <button id="logout" type="button">Sign out</button></p>
        </div>
        <div id="portfolio-table"></div>
        <p id="dashboard-status" class="status" role="status"></p>
    </section>

</main>

<footer>
    © 2026 LFOR
</footer>

<script src="/assets/config.js"></script>
<script type="module" src="tracker.js"></script>

</body>
</html>
